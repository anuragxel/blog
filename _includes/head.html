<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {%- assign page_title = page.title | default: site.title -%}
  {%- if page.title and page.title != site.title -%}
    {%- assign full_title = page_title | append: " — " | append: site.title -%}
  {%- else -%}
    {%- assign full_title = site.title -%}
  {%- endif -%}
  <title>{{ full_title }}</title>

  {% seo title=false %}

  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <!-- KaTeX (modern math typesetting; replaces MathJax 2.7) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
  <script>
    // _plugins/math.rb stashes LaTeX as base64 in data-tex on .math elements
    // (so kramdown can't mangle escapes like \{ or trigger emphasis on _).
    // Decode and render with KaTeX on load.
    document.addEventListener("DOMContentLoaded", function () {
      function render() {
        if (typeof katex === "undefined") {
          return setTimeout(render, 30);
        }
        document.querySelectorAll(".math").forEach(function (el) {
          var tex;
          try { tex = atob(el.dataset.tex || ""); }
          catch (e) { tex = el.textContent; }
          try {
            katex.render(tex, el, {
              displayMode: el.classList.contains("math-display"),
              throwOnError: false,
              strict: "ignore"
            });
          } catch (e) {
            el.textContent = tex;
          }
        });
      }
      render();
    });
  </script>
</head>
