title: Anurag Ghosh
tagline: Notes & writing
description: >-
  Notes, derivations, and longer-form writing by Anurag Ghosh —
  Robotics PhD at Carnegie Mellon, working on computer vision,
  imaging, and autonomous driving.
author: Anurag Ghosh
email: anuraggh@andrew.cmu.edu

url: "https://anuragxel.github.io"
baseurl: "/blog"

home_url: "https://anuragxel.github.io/"
github_username: anuragxel

twitter:
  card: summary
  username: anuragxel

# Default frontmatter — gives every page an og:image / twitter:image
defaults:
  - scope:
      path: ""
    values:
      image: https://anuragxel.github.io/tn/images/profile.jpeg

permalink: /:title/
timezone: America/New_York

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
  # Math is wrapped at build time by _plugins/math.rb (base64 in data-tex).
  # KaTeX renders client-side from _includes/head.html.
  math_engine: mathjax

sass:
  style: compressed
  sass_dir: _sass

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - LICENSE
  - .github
